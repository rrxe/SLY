<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05090b" />
    <title>sly</title>

    <!-- المظهر: الألوان هي الافتراضي. لو المستخدم اختار أبيض وأسود نطبّقه قبل ما الصفحة ترسم -->
    <script>
      try {
        var mono = localStorage.getItem("sly.theme.v1") === "mono";
        document.documentElement.setAttribute("data-theme", mono ? "mono" : "color");
        if (mono) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#050505");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "color");
      }
    </script>

    <!-- خط عربي واضح ومقروء لواجهة اللغة العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- تسريع الاتصال بسيرفرات AdsGram قبل ما نحتاجها فعلياً -->
    <link rel="preconnect" href="https://sad.adsgram.ai" crossorigin>
    <link rel="dns-prefetch" href="https://sad.adsgram.ai">

    <!-- تحميل SDK الخاص بـ AdsGram أول شي، بالتوازي مع كل شي ثاني،
         بدل ما ننتظر React يشتغل ويحقن السكربت بجافاسكربت -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  </head>
  <body>
    <div id="root"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
