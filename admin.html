<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
      margin: 0;
    }
    h2, h3 { color: #40a7e3; margin-bottom: 12px; }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }
    button {
      background: #40a7e3;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.reject { background: #e53935; }
    button.approve { background: #4caf50; }
    .item {
      border-bottom: 1px solid #333;
      padding: 8px 0;
    }
    .status-PENDING { color: #ffb74d; }
    .status-APPROVED { color: #81c784; }
    .status-REJECTED { color: #e57373; }
  </style>
</head>
<body>

  <h2>Admin Panel 🛠️</h2>

  <div class="card">
    <h3>Broadcast Message</h3>
    <textarea id="broadcastMsg" rows="3" placeholder="Type your message..."></textarea>
    <button onclick="sendBroadcast()">Send to All 📢</button>
  </div>

  <div class="card">
    <h3>Add New Task</h3>
    <input type="text" id="taskTitle" placeholder="Task Title">
    <input type="number" id="taskCoins" placeholder="Reward Coins">
    <input type="url" id="taskLink" placeholder="Task Link URL">
    <button onclick="addTask()">Add Task ➕</button>
  </div>

  <div class="card">
    <h3>Pending Withdrawals</h3>
    <div id="withdrawalsList">Loading...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const API_BASE = "";

    async function apiCall(endpoint, method = "GET", body = null) {
      const headers = {
        "Content-Type": "application/json",
        "Authorization": `tga ${tg.initData}`
      };
      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(`${API_BASE}${endpoint}`, options);
      return await res.json();
    }

    async function loadWithdrawals() {
      const container = document.getElementById("withdrawalsList");
      try {
        const data = await apiCall("/api/admin/withdrawals");
        if (data.error) {
          container.innerHTML = `<p style="color:red">${data.error}</p>`;
          return;
        }

        if (data.length === 0) {
          container.innerHTML = "<p>No pending withdrawals.</p>";
          return;
        }

        container.innerHTML = data.map(w => `
          <div class="item">
            <p><strong>User:</strong> @${w.username || 'NoUsername'} (${w.telegram_id})</p>
            <p><strong>Amount:</strong> $${w.amount_usdt} USDT</p>
            <p><strong>Wallet:</strong> <code style="word-break:break-all">${w.wallet_address}</code></p>
            <p><strong>Status:</strong> <span class="status-${w.status}">${w.status}</span></p>
            ${w.status === 'PENDING' ? `
              <div style="display:flex; gap:8px;">
                <button class="approve" onclick="updateWithdrawal('${w.id}', 'APPROVED')">Approve ✅</button>
                <button class="reject" onclick="updateWithdrawal('${w.id}', 'REJECTED')">Reject ❌</button>
              </div>
            ` : ''}
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = "<p>Error loading data.</p>";
      }
    }

    async function updateWithdrawal(withdrawalId, status) {
      const res = await apiCall("/api/admin/withdrawals/status", "POST", { withdrawalId, status });
      if (res.success) {
        alert("Status updated");
        loadWithdrawals();
      } else {
        alert(res.error || "Operation failed");
      }
    }

    async function addTask() {
      const title = document.getElementById("taskTitle").value;
      const rewardCoins = parseInt(document.getElementById("taskCoins").value);
      const linkUrl = document.getElementById("taskLink").value;

      if (!title || !rewardCoins || !linkUrl) return alert("Fill all fields");

      const res = await apiCall("/api/admin/tasks", "POST", { title, rewardCoins, linkUrl });
      if (res.success) {
        alert("Task added successfully");
        document.getElementById("taskTitle").value = "";
        document.getElementById("taskCoins").value = "";
        document.getElementById("taskLink").value = "";
      } else {
        alert(res.error || "Error");
      }
    }

    async function sendBroadcast() {
      const message = document.getElementById("broadcastMsg").value;
      if (!message) return alert("Type a message first");

      const res = await apiCall("/api/admin/broadcast", "POST", { message });
      if (res.success) {
        alert(`Sent to ${res.sentCount} users`);
        document.getElementById("broadcastMsg").value = "";
      } else {
        alert(res.error || "Error sending broadcast");
      }
    }

    loadWithdrawals();
  </script>
</body>
</html>
